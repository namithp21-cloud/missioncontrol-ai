<!doctype html>
<html lang="en" translate="no">
<head>
  <meta charset="utf-8">
  <meta name="google" content="notranslate">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>MissionControl AI</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <a class="skip-link" href="#view">Skip to content</a>
  <div class="app" id="app">
    <aside class="sidebar" id="sidebar" aria-label="Primary navigation">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-name">MissionControl <b>AI</b></span>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-foot">
        <div class="mode-chip" id="mode-chip"></div>
        <button class="btn btn-ghost btn-sm btn-block" id="reset-demo" type="button"></button>
        <button class="btn btn-ghost btn-sm btn-block collapse-btn" id="collapse" type="button" aria-expanded="true"></button>
      </div>
    </aside>
    <div class="scrim" id="scrim" hidden></div>
    <div class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menu-btn" type="button" aria-label="Open navigation" aria-controls="sidebar"></button>
        <div class="workspace" id="workspace"></div>
        <div class="topbar-spacer"></div>
        <div class="topbar-project" id="topbar-project"></div>
        <div class="notif-wrap">
          <button class="icon-btn" id="notif-btn" type="button" aria-label="Notifications" aria-haspopup="dialog" aria-expanded="false"></button>
          <div class="popover" id="notif-pop" role="dialog" aria-label="Notifications" hidden></div>
        </div>
        <span class="avatar" id="avatar" title="Workspace Operator — Local Coordination Node" role="img" aria-label="Your profile">NP</span>
      </header>
      <main id="view" tabindex="-1" aria-live="polite"></main>
    </div>
  </div>
  <div class="toasts" id="toasts" role="region" aria-label="Notifications"></div>
  <dialog id="dialog" class="dialog"></dialog>
  <noscript><p>MissionControl AI requires JavaScript enabled.</p></noscript>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
